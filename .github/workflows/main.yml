name: Build Borgen market report

on:
  push:
    branches: [main]
    paths:
      - "Borgen’s Camps - Borgen’s Camp.csv"
      - "render_borgen_static.js"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build reports
        run: |
          node render_borgen_static.js --exclude-outlier-dates
          node render_borgen_static.js
          mkdir -p docs
          cp Borgen_price_analysis.html docs/index.html
          cp Borgen_price_analysis.html docs/Borgen_price_analysis.html
          cp Borgen_price_analysis_with_outlier_dates.html docs/
          touch docs/.nojekyll

      - name: Commit published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Publish Borgen market report"
          git push
