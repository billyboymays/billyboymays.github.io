name: Publish Borgen market report

on:
  push:
    branches: [main]
    paths:
      - "Borgen’s Camps - Borgen’s Camp.csv"
      - "render_borgen_static.js"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build reports
        run: |
          node render_borgen_static.js --exclude-outlier-dates
          node render_borgen_static.js
          mkdir site
          cp Borgen_price_analysis.html site/index.html
          cp Borgen_price_analysis_with_outlier_dates.html site/
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
